[terminal]
#shell = "/usr/bin/bash"
shell = "/usr/bin/zsh"

[window]
#decorations = "None"
padding = { x = 4, y = 4 }

[font]
normal.family = "Noto Sans Mono"
size = 11


# Colors (One Dark)

# Default colors
[colors.primary]
background = '#21252b'
foreground = '#abb2bf'

# Normal colors
[colors.normal]
black   = '#1e2127'
red     = '#e06c75'
green   = '#98c379'
yellow  = '#d19a66'
blue    = '#61afef'
magenta = '#c678dd'
cyan    = '#56b6c2'
white   = '#abb2bf'

# Bright colors
[colors.bright]
black   = '#5c6370'
red     = '#e06c75'
green   = '#98c379'
yellow  = '#d19a66'
blue    = '#61afef'
magenta = '#c678dd'
cyan    = '#56b6c2'
white   = '#ffffff'
